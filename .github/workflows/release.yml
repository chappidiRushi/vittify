name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger from GitHub UI
    inputs:
      dry_run:
        description: 'Dry run (no release, just preview)'
        required: false
        default: false
        type: boolean
      upload_to_play_store:
        description: 'Upload to Google Play Store'
        required: false
        default: false
        type: boolean
      play_store_track:
        description: 'Play Store release track'
        required: false
        type: choice
        default: 'internal'
        options:
          - internal    # Internal testing track (recommended for initial testing)
          - alpha       # Closed testing track
          - beta        # Open testing track
          - production  # Production release
      play_store_status:
        description: 'Play Store release status'
        required: false
        type: choice
        default: 'draft'
        options:
          - draft       # Create as draft, manual review needed
          - completed   # Complete the release immediately
      prerelease:
        description: 'Mark as pre-release (overrides auto-detection)'
        required: false
        default: false
        type: boolean
      version_name:
        description: 'Override release version name (e.g. 3.0.0). Leave empty for auto-update.'
        required: false
        type: string
        default: ''

jobs:
  release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CURRENT_CODE=$(grep "versionCode" app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "code=$CURRENT_CODE" >> $GITHUB_OUTPUT
          echo "Current base version: $CURRENT_VERSION (code: $CURRENT_CODE)"
      
      - name: Parse release version
        id: next_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          CURRENT_CODE="${{ steps.current_version.outputs.code }}"
          BRANCH="${{ github.ref_name }}"
          
          # Ensure git tags are fetched
          git fetch --tags --force 2>/dev/null || true
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag-based release: use tag name without 'v'
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            CLEAN_V="${VERSION%%-*}"
            IFS='.' read -r M N P <<< "$CLEAN_V"
            CODE=$(( ${M:-1} * 10000 + ${N:-0} * 100 + ${P:-0} ))
            echo "Mode: Tagged release ($VERSION, code: $CODE)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_name }}" ]; then
            # Manual trigger override
            VERSION="${{ inputs.version_name }}"
            VERSION="${VERSION#v}"
            CLEAN_V="${VERSION%%-*}"
            IFS='.' read -r M N P <<< "$CLEAN_V"
            CODE=$(( ${M:-1} * 10000 + ${N:-0} * 100 + ${P:-0} ))
            echo "Mode: Manual version override ($VERSION, code: $CODE)"
          elif [ "$BRANCH" = "dev" ]; then
            # Dev branch: beta release -> only update the patch version
            PREV_VER=$(gh release view pre-release -R "${{ github.repository }}" --json name -q '.name' 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
            LATEST_STABLE_TAG=$(git tag -l "v*" | grep -v "beta\|alpha\|rc\|pre" | sort -V | tail -n 1 | sed 's/^v//' || echo "")
            
            BASE="${CURRENT_VERSION%%-*}"
            if [ -n "$LATEST_STABLE_TAG" ]; then
              if [ "$(printf '%s\n%s' "$BASE" "$LATEST_STABLE_TAG" | sort -V | tail -n 1)" = "$LATEST_STABLE_TAG" ]; then
                BASE="$LATEST_STABLE_TAG"
              fi
            fi
            if [ -n "$PREV_VER" ]; then
              if [ "$(printf '%s\n%s' "$BASE" "$PREV_VER" | sort -V | tail -n 1)" = "$PREV_VER" ]; then
                BASE="$PREV_VER"
              fi
            fi
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            MAJOR="${MAJOR:-2}"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"
            PATCH=$((PATCH + 1))
            CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            VERSION="${MAJOR}.${MINOR}.${PATCH}-beta"
            echo "Mode: Dev branch beta release -> updated patch to $VERSION (code: $CODE)"
          else
            # Main branch: stable release -> update the major version, NO beta tag
            CLEAN_VERSION="${CURRENT_VERSION%%-*}"
            IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$CLEAN_VERSION"
            BASE_MAJOR="${BASE_MAJOR:-2}"
            
            LATEST_STABLE_TAG=$(git tag -l "v*" | grep -v "beta\|alpha\|rc\|pre" | sort -V | tail -n 1 | sed 's/^v//' || echo "")
            if [ -n "$LATEST_STABLE_TAG" ]; then
              TAG_MAJOR=$(echo "$LATEST_STABLE_TAG" | cut -d. -f1)
              if [ "$TAG_MAJOR" -ge "$BASE_MAJOR" ]; then
                MAJOR=$((TAG_MAJOR + 1))
              else
                MAJOR=$((BASE_MAJOR + 1))
              fi
            else
              MAJOR=$((BASE_MAJOR + 1))
            fi
            
            while git rev-parse "refs/tags/v${MAJOR}.0.0" >/dev/null 2>&1; do
              MAJOR=$((MAJOR + 1))
            done
            
            VERSION="${MAJOR}.0.0"
            CODE=$(( MAJOR * 10000 ))
            echo "Mode: Main branch stable release -> updated major to $VERSION (code: $CODE)"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (code: $CODE)"
      
      - name: Configure Release Type
        id: release_config
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          
          if [ "$BRANCH" = "dev" ]; then
            echo "is_dev=true" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tag_name=pre-release" >> $GITHUB_OUTPUT
            echo "release_name=Vittify Pre-Release (v$VERSION)" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
            echo "Mode: Rolling Pre-Release for dev branch (updating tag 'pre-release')"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.prerelease }}" ]; then
            IS_PRE="${{ inputs.prerelease }}"
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "prerelease=$IS_PRE" >> $GITHUB_OUTPUT
            echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
            echo "release_name=Vittify v$VERSION" >> $GITHUB_OUTPUT
            if [ "$IS_PRE" = "true" ]; then
              echo "make_latest=false" >> $GITHUB_OUTPUT
            else
              echo "make_latest=true" >> $GITHUB_OUTPUT
            fi
            echo "Mode: Manual trigger (prerelease=$IS_PRE)"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Vittify v$VERSION" >> $GITHUB_OUTPUT
            if echo "${{ github.ref_name }}" | grep -qiE "beta|alpha|rc|preview"; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
              echo "make_latest=false" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
              echo "make_latest=true" >> $GITHUB_OUTPUT
            fi
            echo "Mode: Tagged release (${{ github.ref_name }})"
          else
            # Push to main branch -> Always standard Release, NO beta tag
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
            echo "release_name=Vittify v$VERSION" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
            echo "Mode: Stable Release for main branch (tag: v$VERSION)"
          fi
      
      - name: Generate changelog
        id: changelog
        run: |
          NEXT_VERSION="${{ steps.next_version.outputs.version }}"
          IS_DEV="${{ steps.release_config.outputs.is_dev }}"
          
          if [ "$IS_DEV" = "true" ]; then
            echo "# Vittify Pre-Release (v$NEXT_VERSION)" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "> ⚠️ **Pre-Release Build**: Automatically updated from the \`dev\` branch." >> RELEASE_NOTES.md
            echo "> **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "### Recent Commits" >> RELEASE_NOTES.md
            git log -n 10 --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
          else
            LAST_TAG=$(git describe --tags --abbrev=0 --exclude="*pre-release*" 2>/dev/null || echo "")
            echo "# Release v$NEXT_VERSION" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            
            if [ -n "$LAST_TAG" ]; then
              echo "## Changes since $LAST_TAG" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
            else
              echo "## Release v$NEXT_VERSION" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              git log -n 10 --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
            fi
          fi
          
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "### Installation" >> RELEASE_NOTES.md
          echo "Download the APK below and install it on your Android device." >> RELEASE_NOTES.md
          echo "- **Universal APK**: Works on all supported Android devices." >> RELEASE_NOTES.md
          echo "- **Architecture-specific APKs**: Smaller download specifically optimized for your CPU architecture (e.g. arm64-v8a for modern phones)." >> RELEASE_NOTES.md
          
          cat RELEASE_NOTES.md
      
      - name: Validate Secrets
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_BASE64"; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_PASSWORD"; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEY_ALIAS"; fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEY_PASSWORD"; fi
          
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required repository secrets for release signing:$MISSING_SECRETS"
            echo "::error::Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions and add the missing secrets."
            exit 1
          fi
          echo "✅ All signing secrets are present"

      - name: Decode Keystore
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Strip any linebreaks, carriage returns, or whitespace that can corrupt base64 decoding
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          KEYSTORE_SIZE=$(stat -c%s app/release.keystore)
          echo "✅ Release keystore created ($KEYSTORE_SIZE bytes)"
          if [ "$KEYSTORE_SIZE" -lt 500 ]; then
            echo "::error::Decoded keystore is suspiciously small ($KEYSTORE_SIZE bytes). Please verify the KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          # Early verification of keystore and alias before starting Gradle build
          echo "Verifying keystore credentials..."
          keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "✅ Keystore verified successfully with alias '$KEY_ALIAS'"

      - name: Restore Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo -n "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "✅ Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "✅ Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          else
            echo "::warning::Neither GOOGLE_SERVICES_JSON nor GOOGLE_SERVICES_JSON_BASE64 secret was found! Creating fallback google-services.json for build."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "vittify",
              "storage_bucket": "vittify.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.reddy.vittify"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      
      - name: Build Release APKs
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"
        run: |
          IS_DEV="${{ steps.release_config.outputs.is_dev }}"
          APP_NAME="@string/app_name"
          IS_BETA="false"
          if [ "$IS_DEV" = "true" ]; then
            APP_NAME="Vittify Beta"
            IS_BETA="true"
          fi

          echo "Building signed standard APKs (version: ${{ steps.next_version.outputs.version }}, code: ${{ steps.next_version.outputs.code }}, isBeta: $IS_BETA)..."
          ./gradlew assembleStandardRelease \
            -Papp.versionName="${{ steps.next_version.outputs.version }}" \
            -Papp.versionCode="${{ steps.next_version.outputs.code }}" \
            -Papp.appName="$APP_NAME" \
            -Papp.isBeta="$IS_BETA" \
            -Papp.commitHash="${{ github.sha }}" \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      
      - name: Rename APKs
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          IS_DEV="${{ steps.release_config.outputs.is_dev }}"
          STANDARD_PATH="app/build/outputs/apk/standard/release"
          
          PREFIX="Vittify"
          if [ "$IS_DEV" = "true" ]; then
            PREFIX="Vittify-beta"
          fi
          
          # Rename universal APK (contains all architectures)
          if [ -f "$STANDARD_PATH/app-standard-universal-release.apk" ]; then
            mv "$STANDARD_PATH/app-standard-universal-release.apk" \
               "$STANDARD_PATH/${PREFIX}-v${VERSION}-universal.apk"
          elif [ -f "$STANDARD_PATH/app-standard-release.apk" ]; then
            mv "$STANDARD_PATH/app-standard-release.apk" \
               "$STANDARD_PATH/${PREFIX}-v${VERSION}-universal.apk"
          fi
          
          # Rename architecture-specific APKs
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "$STANDARD_PATH/app-standard-${arch}-release.apk" ]; then
              mv "$STANDARD_PATH/app-standard-${arch}-release.apk" \
                 "$STANDARD_PATH/${PREFIX}-v${VERSION}-${arch}.apk"
            fi
          done
          
          echo "Generated APKs:"
          ls -la "$STANDARD_PATH/"
      
      - name: Calculate SHA256
        if: ${{ !inputs.dry_run }}
        run: |
          cd app/build/outputs/apk/standard/release/
          for apk in Vittify-*.apk; do
            if [ -f "$apk" ]; then
              sha256sum "$apk" > "${apk}.sha256"
              echo "SHA256 for $apk:"
              cat "${apk}.sha256"
            fi
          done

      - name: Upload Release APKs as Artifacts
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Vittify-v${{ steps.next_version.outputs.version }}-apks
          path: |
            app/build/outputs/apk/standard/release/Vittify-*.apk
            app/build/outputs/apk/standard/release/*.sha256
          retention-days: 30
      
      - name: Clean up old pre-release assets
        if: ${{ !inputs.dry_run && steps.release_config.outputs.is_dev == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_config.outputs.tag_name }}"
          echo "Cleaning up existing assets from rolling pre-release '$TAG'..."
          gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            if [ -n "$asset" ]; then
              echo "Deleting old asset: $asset"
              gh release delete-asset "$TAG" "$asset" -R "${{ github.repository }}" -y || true
            fi
          done || true

      - name: Create or Update GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_config.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_config.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/standard/release/Vittify-*.apk
            app/build/outputs/apk/standard/release/*.sha256
          draft: false
          prerelease: ${{ steps.release_config.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release_config.outputs.make_latest }}
      
      - name: Dry Run Summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 DRY RUN SUMMARY"
          echo "=================="
          echo "Version: ${{ steps.next_version.outputs.version }}"
          echo "Version code: ${{ steps.next_version.outputs.code }}"
          echo ""
          echo "📝 Release Notes:"
          cat RELEASE_NOTES.md
      
      - name: Build App Bundle for Play Store
        if: ${{ !inputs.dry_run && inputs.upload_to_play_store }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building signed App Bundle for Play Store..."
          ./gradlew bundleStandardRelease \
            -Papp.versionName="${{ steps.next_version.outputs.version }}" \
            -Papp.versionCode="${{ steps.next_version.outputs.code }}" \
            -Papp.appName="@string/app_name" \
            -Papp.isBeta="false" \
            -Papp.commitHash="${{ github.sha }}" \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          
          # Rename AAB file
          AAB_PATH="app/build/outputs/bundle/standardRelease"
          mv "$AAB_PATH/app-standard-release.aab" \
             "$AAB_PATH/Vittify-v${{ steps.next_version.outputs.version }}.aab"
          echo "App Bundle created: $AAB_PATH/Vittify-v${{ steps.next_version.outputs.version }}.aab"
      
      - name: Upload to Play Store
        if: ${{ !inputs.dry_run && inputs.upload_to_play_store }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.reddy.vittify
          releaseFiles: app/build/outputs/bundle/standardRelease/Vittify-v${{ steps.next_version.outputs.version }}.aab
          track: ${{ inputs.play_store_track }}
          status: ${{ inputs.play_store_status }}
          releaseName: v${{ steps.next_version.outputs.version }}
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs/
          mappingFile: app/build/outputs/mapping/standardRelease/mapping.txt
      
      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f app/release.keystore
          rm -f app/google-services.json

